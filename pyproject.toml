[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "bayesmith"
version = "0.1.0"
description = "Auditable Bayesian optimization harness generator for systems tuning"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["pydantic>=2.7,<3", "PyYAML>=6.0", "Jinja2>=3.1", "typer>=0.12", "rich>=13", "numpy>=1.26", "scipy>=1.12"]

[project.optional-dependencies]
optuna = ["optuna==5.0.0"]
botorch = ["botorch>=0.13,<1", "gpytorch>=1.13", "torch>=2.5"]
smac = ["smac>=2.2,<3"]
llm = ["httpx>=0.27"]
dev = ["pytest>=8", "ruff>=0.9", "mypy>=1.13"]

[project.scripts]
bayesmith = "bayesmith.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/bayesmith"]

[tool.hatch.build.targets.wheel.force-include]
"src/bayesmith/catalog" = "bayesmith/catalog"
"src/bayesmith/backends/capabilities" = "bayesmith/backends/capabilities"
"src/bayesmith/codegen/templates" = "bayesmith/codegen/templates"
"examples" = "bayesmith/examples"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
exclude = ["src/bayesmith/codegen/templates/"]
